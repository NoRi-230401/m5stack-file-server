; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
;default_envs = m5core2 
default_envs = m5core2-sdu
;default_envs = m5coreS3 
;default_envs = m5coreS3-sdu
 

[env]
platform = espressif32
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_type = release
monitor_filters =
    esp32_exception_decoder
    time
build_flags=
    -DCORE_DEBUG_LEVEL=1
    -Wno-deprecated-declarations
    -Wno-cpp
lib_deps =
    https://github.com/me-no-dev/AsyncTCP
    https://github.com/me-no-dev/ESPAsyncWebServer
    m5stack/M5Unified

[sd-updater]
build_flags=
    -DENABLE_SD_UPDATER
lib_deps = 
	tobozo/M5Stack-SD-Updater

[env:m5core2]
;-- Core2 v1.0/v1.1/AWS --
board = m5stack-core2
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.filesystem = spiffs

build_flags =
    -DBOARD_HAS_PSRAM

[env:m5core2-sdu]
;-- Core2 v1.0/AWS -- excluding v1.1
extends = env:m5core2, sd-updater
board_build.partitions = default_16MB.csv
build_flags = ${env:m5core2.build_flags} ${sd-updater.build_flags}
lib_deps = ${env:m5core2.lib_deps} ${sd-updater.lib_deps}


[env:m5coreS3]
;-- CoreS3/SE --
board = m5stack-cores3
board_build.arduino.memory_type = qio_qspi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.filesystem = spiffs

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1


[env:m5coreS3-sdu]
extends = env:m5coreS3, sd-updater
build_flags = ${env:m5coreS3.build_flags} ${sd-updater.build_flags}
lib_deps = ${env:m5coreS3.lib_deps} ${sd-updater.lib_deps}


